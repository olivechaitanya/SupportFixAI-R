version: '3.8'

services:
  supportfix-ai:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=AIzaSyCrMCSPZqNN8GqDHXbudkzHWwQ9SL7FH8s
      - GEMINI_MODEL=gemini-2.5-flash
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
